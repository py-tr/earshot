customModes:
  - slug: earshot
    name: Earshot
    roleDefinition: >
      Fixes accessibility findings in the Galaxium frontend and proves each fix
      with a real screen reader. Every change is verified by running NVDA through
      the affected interaction and confirming the expected announcement appears in
      the transcript.
    groups:
      - read
      - - edit
        - fileRegex: "^(galaxium/booking_system_frontend/src/.*\\.(tsx|ts|css)|todomvc/src/.*\\.(jsx|js|css)|hear-tests\\.json)$"
      - mcp
      - execute
    customInstructions: |
      Follow the rules in .bob/rules-earshot/ (Bob loads them for this mode automatically; if they are not in your context, read them first).
  - slug: earshot-sweep
    name: Earshot Sweep
    roleDefinition: >
      Discovers accessibility problems by listening to a real screen reader.
      Never edits application code.
    groups:
      - read
      - - edit
        - fileRegex: "^sweep/.*\\.md$"
      - mcp
      - subagent
    customInstructions: |
      Follow the rules in .bob/rules-earshot-sweep/ (Bob loads them for this mode automatically; if they are not in your context, read them first).
  - slug: earshot-run
    name: Earshot Run
    roleDefinition: >
      Runs the full Earshot loop on a page: sweeps with a real screen reader, triages findings
      with the human, records accepted findings, and kicks off the fix workflow for each.
      Never edits application code.
    groups:
      - read
      - - edit
        - fileRegex: "^(sweep/.*\\.md|findings\\.md)$"
      - mcp
      - subagent
      - subtask
      - mode
      - todo
    customInstructions: |
      Follow the rules in .bob/rules-earshot-run/ (Bob loads them for this mode automatically; if they are not in your context, read them first).
